name: LedgerLab CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-build-and-test:
    name: Android Build, Financial Engine & Robolectric Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Run unit, financial integrity & Robolectric UI tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

  postgres-migration-verification:
    name: PostgreSQL Schema, Deferred Triggers & Seed Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: ledgerlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply PostgreSQL schema migration and seed
        env:
          PGPASSWORD: ci_ephemeral_password
        run: |
          psql -h localhost -U postgres -d ledgerlab_test -v ON_ERROR_STOP=1 -f db/migrations/001_initial_schema.sql
          psql -h localhost -U postgres -d ledgerlab_test -v ON_ERROR_STOP=1 -f db/seeds/001_demo_seed.sql

      - name: Verify double-entry balance and immutability triggers
        env:
          PGPASSWORD: ci_ephemeral_password
        run: |
          psql -h localhost -U postgres -d ledgerlab_test -v ON_ERROR_STOP=1 -c "
            SELECT journal_entry_id,
                   SUM(CASE WHEN side = 'DEBIT' THEN amount_paise ELSE 0 END) AS debits,
                   SUM(CASE WHEN side = 'CREDIT' THEN amount_paise ELSE 0 END) AS credits
            FROM ledger_postings
            GROUP BY journal_entry_id
            HAVING SUM(CASE WHEN side = 'DEBIT' THEN amount_paise ELSE 0 END) <>
                   SUM(CASE WHEN side = 'CREDIT' THEN amount_paise ELSE 0 END);
          "
          # Confirm immutability trigger blocks updates on posted ledger_postings
          ! psql -h localhost -U postgres -d ledgerlab_test -v ON_ERROR_STOP=1 -c "UPDATE ledger_postings SET amount_paise = 1;"
